# ==============================================================================
# BusinessArchitect — Ultra-Detailed Production Blueprint for Render.com
# ==============================================================================
# This specification provisions both the containerized full-stack web service
# (FastAPI + React 19 SPA) and the managed PostgreSQL database on Render.
#
# Key Features:
# 1. Multi-stage Docker build: Builds React 19 frontend into static assets and
#    runs production-hardened Uvicorn backend with Argon2id and Google GenAI.
# 2. Automated Database Migration: Pre-deployment hook runs Alembic migrations
#    (cd /app/server && alembic upgrade head) before traffic switches over.
# 3. Native Health Checks: Uses `/health` for zero-downtime rolling deploys.
# 4. Zero Secrets Committed: Session secrets & admin passwords auto-generated;
#    Gemini API keys managed securely via Render Environment Dashboard.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Full-Stack Web Application Service
  # ----------------------------------------------------------------------------
  - type: web
    name: business-architect
    runtime: docker
    plan: starter                  # 'starter' recommended; switch to 'free' for initial testing
    region: oregon                 # Deploy in same region as database for lowest network latency
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health       # Native container health endpoint verified by Docker & Uvicorn
    preDeployCommand: cd /app/server && alembic upgrade head
    autoDeploy: true

    envVars:
      # --- Core Application Environment ---
      - key: APP_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: 10000

      # --- Cookie & Session Security ---
      # Forces HTTPS-only cookies (SameSite=Lax) in production
      - key: COOKIE_SECURE
        value: "true"

      # Render generates a cryptographically random 256-bit secret string automatically
      - key: SESSION_SECRET
        generateValue: true

      # --- Managed PostgreSQL Database Connection ---
      # Automatically wires connection string from the 'business-architect-db' database below.
      # To use Supabase or external PostgreSQL instead, change 'fromDatabase' to 'sync: false'
      # and supply your pooled connection string: postgresql://postgres.xxx:pass@pooler.supabase.com:6543/postgres?sslmode=require
      - key: DATABASE_URL
        fromDatabase:
          name: business-architect-db
          property: connectionString

      # --- Google Gemini AI Engine Configuration ---
      # Supply your single Gemini API key. The backend automatically populates both
      # single-key and credential-pool requirements from this single key.
      - key: GEMINI_API_KEY
        sync: false

      # Primary configured model set to Gemini 2.5 Flash as requested.
      # Built-in resilient provider fallback ensures zero downtime even during provider sunset windows.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # Generation timeouts and quota cooldown periods in seconds
      - key: GEMINI_TOTAL_TIMEOUT_SECONDS
        value: "90"

      - key: GEMINI_KEY_COOLDOWN_SECONDS
        value: "120"

      - key: GEMINI_FALLBACK_MODELS_ENABLED
        value: "true"

      # --- CORS Origin Allowlist ---
      # Render automatically supplies RENDER_EXTERNAL_URL (e.g. https://business-architect.onrender.com).
      # If you use custom domains (e.g. https://app.yourdomain.com), enter them as comma-separated values.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- Administrator One-Time Bootstrap Provisioning ---
      # Keep ADMIN_BOOTSTRAP_ENABLED=false after initial provisioning for maximum security.
      # Set to 'true' only on initial launch to create the superuser, then disable.
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: "false"

      - key: INITIAL_ADMIN_USERNAME
        value: HannyAdmin

      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true        # Automatically generates strong random password in Render dashboard

      - key: INITIAL_ADMIN_EMAIL
        value: admin@businessarchitect.internal

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: business-architect-db
    plan: free                     # Render free Postgres tier (or 'starter' for persistent backup retention)
    region: oregon                 # Must match web service region
    databaseName: business_architect
    user: business_user
    ipAllowList: []                # Empty list permits internal secure connections from Render web service
